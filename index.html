<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MRAN Logistics - Air Freight Calculator</title>
<style>
  body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }
  h1 { color: #0B3C5D; font-size: 22px; margin-bottom: 6px; }
  .calculator { max-width: 600px; background: #fff; padding: 20px; border-radius: 8px; border-top: 6px solid #0B3C5D; }
  label { display: block; margin-top: 10px; font-size: 14px; }
  input, select, button { width: 100%; padding: 8px; margin-top: 6px; font-size: 14px; }
  button { cursor: pointer; background: #0B3C5D; color: #fff; border: none; }
  .result { margin-top: 20px; font-size: 14px; line-height: 1.6; }
  .package-card { background: #e8f0f8; border: 1px solid #0B3C5D; border-radius: 6px; padding: 12px; margin-bottom: 12px; }
  .package-card h3 { margin: 0 0 8px 0; font-size: 16px; color: #0B3C5D; }
  .quote-card { background: #f1f1f1; border: 1px solid #0B3C5D; border-radius: 6px; padding: 12px; }
  .tracking-section { margin-top: 10px; }
  .error { color: red; margin-top: 10px; font-weight: bold; }
  .add-package-btn { background: #E65100; margin-top: 10px; }
</style>
</head>
<body>

<div class="calculator">
  <h1>MRAN LOGISTICS</h1>
  <p>Air freight is billed using the higher of actual weight or volumetric weight. Minimum charge $15 plus $5 customs clearance.</p>

  <label>Client Name</label>
  <input type="text" id="clientName" placeholder="Client name" />

  <label>
    <input type="checkbox" id="homeDelivery" /> Add Home Delivery
  </label>

  <label>Display Currency</label>
  <select id="currency">
    <option value="USD">USD</option>
    <option value="KES">KES</option>
  </select>

  <div id="packages"></div>
  <button type="button" class="add-package-btn" onclick="addPackage()">+ Add Package</button>

  <button type="button" onclick="calculateCost()">Calculate Cost</button>
  <div class="error" id="errorMsg"></div>
  <div class="result" id="result"></div>

  <button id="copyBtn" style="display:none; margin-top:10px;">Copy Quote</button>
  <a id="whatsappBtn" target="_blank" style="display:none; margin-top:16px; display:block; text-align:center; background:#25D366; color:#fff; padding:10px; text-decoration:none;">
    Get Quote on WhatsApp
  </a>
</div>

<script>
const RATE_PER_KG = 15;
const USD_TO_KES = 135;
const MIN_CHARGE = 15;
const CLEARANCE = 5;

function clearError(){ document.getElementById('errorMsg').innerText=''; }

function addPackage(){
  const pkgDiv = document.createElement('div');
  pkgDiv.className = 'package-card package';

  const index = document.querySelectorAll('#packages .package').length + 1;

  pkgDiv.innerHTML = `
    <h3>Package ${index}</h3>
    <label>Length (inches)</label><input type="number" class="L" />
    <label>Width (inches)</label><input type="number" class="W" />
    <label>Height (inches)</label><input type="number" class="H" />
    <label>Actual Weight (kg)</label><input type="number" class="A" />
    <div class="tracking-section">
      <label>Tracking Number</label><input type="text" class="T" placeholder="Tracking #">
      <label>Store/Source</label><input type="text" class="S" placeholder="Store">
      <label>Quantity</label><input type="number" class="Q" placeholder="Qty" min="1" />
      <label>Description (max 30 chars)</label><input type="text" class="D" placeholder="Description" maxlength="30" />
    </div>
  `;
  document.getElementById('packages').appendChild(pkgDiv);
}

function showError(msg){ document.getElementById('errorMsg').innerText = msg; }

function calculateCost(){
  clearError();
  const packages = document.querySelectorAll('#packages .package');
  if(packages.length===0){ showError('Add at least one package'); return; }

  let totalChargeable = 0;
  let totalAirUSD = 0;
  let breakdownHtml = '';
  let trackingText = '';

  for(let i=0;i<packages.length;i++){
    const pkg = packages[i];
    const L = Number(pkg.querySelector('.L').value);
    const W = Number(pkg.querySelector('.W').value);
    const H = Number(pkg.querySelector('.H').value);
    const A = Number(pkg.querySelector('.A').value);
    const T = pkg.querySelector('.T').value.trim() || 'Pending';
    const S = pkg.querySelector('.S').value.trim() || 'N/A';
    const Q = Number(pkg.querySelector('.Q').value) || 1;
    const D = pkg.querySelector('.D').value.trim() || '';

    if(!L||!W||!H||!A||A<=0){ showError('Fill all fields correctly for each package'); return; }

    const volumetric = (L*W*H)/366;
    const chargeable = Math.max(A, volumetric);
    const airFreight = Math.max(chargeable*RATE_PER_KG, MIN_CHARGE);

    totalChargeable += chargeable;
    totalAirUSD += airFreight;

    breakdownHtml += `
      <strong>Package ${i+1}</strong><br>
      Weight: ${A.toFixed(2)} KG<br>
      Dimensions: ${L.toFixed(2)} x ${W.toFixed(2)} x ${H.toFixed(2)} inches<br>
      Volumetric Weight: ${volumetric.toFixed(2)} KG<br>
      Chargeable Weight: ${chargeable.toFixed(2)} KG<br>
      Air Freight: $${airFreight.toFixed(2)} (Minimum $${MIN_CHARGE})<br>
      Customs Clearance: $${CLEARANCE.toFixed(2)}<br>
      Tracking: ${T}, Store: ${S}, Qty: ${Q}, Desc: ${D}<br><br>
    `;

    trackingText += `Package ${i+1} - Tracking: ${T}, Store: ${S}, Qty: ${Q}, Desc: ${D}\n`;
  }

  let deliveryKes = 0;
  let deliveryBreakdown='';
  if(document.getElementById('homeDelivery').checked){
    if(totalChargeable<=5){ 
      deliveryKes=450; 
      deliveryBreakdown='Delivery: First 5 kg = KES450'; 
    } else { 
      const extra = totalChargeable-5; 
      deliveryKes = 450 + extra*75; 
      deliveryBreakdown=`Delivery: First 5kg=KES450, Extra ${extra.toFixed(2)}kg ×75=KES${(extra*75).toFixed(0)}`; 
    }
  } else { deliveryBreakdown='No home delivery'; }

  const costUsd = totalAirUSD + CLEARANCE;
  const costKes = costUsd*USD_TO_KES + deliveryKes;

  const clientName = document.getElementById('clientName').value || 'Client';
  const currency = document.getElementById('currency').value;
  const today = new Date().toLocaleDateString('en-GB');
  const ref = 'MRAN-'+Date.now().toString().slice(-6);

  document.getElementById('result').innerHTML = `
    <div class="quote-card">
      <h3>Shipping Quote</h3>
      <strong>Client:</strong> ${clientName}<br>
      <strong>Date:</strong> ${today}<br>
      <strong>Reference:</strong> ${ref}<br><br>
      ${breakdownHtml}
      <strong>${deliveryBreakdown}</strong><br>
      <strong>Total Payable:</strong> $${costUsd.toFixed(2)} / KES ${costKes.toFixed(0)}
    </div>
  `;

  const message = `
Hello ${clientName}

${breakdownHtml.replace(/<br>/g,'\n')}
${deliveryBreakdown}
Total Cost: $${costUsd.toFixed(2)} / KES ${costKes.toFixed(0)}

Tracking Info:
${trackingText}

Date: ${today}
Reference: ${ref}
`;

  const phone = '254725041080';
  const whatsappLink = 'https://wa.me/'+phone+'?text='+encodeURIComponent(message);
  const whatsappBtn = document.getElementById('whatsappBtn');
  whatsappBtn.href = whatsappLink;
  whatsappBtn.style.display='block';

  const copyBtn = document.getElementById('copyBtn');
  copyBtn.style.display='block';
  copyBtn.onclick = ()=>{ navigator.clipboard.writeText(message); copyBtn.innerText='Copied!'; setTimeout(()=>{copyBtn.innerText='Copy Quote';},2000); };
}

// Add first package by default
addPackage();
</script>

</body>
</html>
